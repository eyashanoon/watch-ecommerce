<div class="chat-container">
  <div class="messages">
    <div
      *ngFor="let msg of messages"
      [ngClass]="{ sent: msg.senderId === senderId, received: msg.senderId !== senderId }"
    >
      <span class="message-content">{{ msg.content }}</span>
      <span class="message-meta">
        {{ msg.senderId === senderId ? 'You' : 'Them' }}
        <!-- Optionally display timestamp -->
      </span>
    </div>
  </div>

  <div class="input-area">
    <input [(ngModel)]="newMessage" (keyup.enter)="sendMessage()" placeholder="Type your message here..." />
    <button (click)="sendMessage()">Send</button>
  </div>
</div>
