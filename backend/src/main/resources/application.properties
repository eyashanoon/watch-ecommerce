spring.application.name=backend
spring.datasource.url=jdbc:mysql://10.10.33.90:3306/watches_db
spring.datasource.username=user
spring.datasource.password=0000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.tomcat.max-part-count=1000

# files properties
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=20MB


# Optional: Specify the MySQL driver explicitly
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Hibernate dialect (optional but recommended)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
